<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Домашний хаб: беговая дорожка, станции Fossibot, сеть и состояние сервера">
  <title>Домашний хаб</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/home/home.css">
</head>
<body class="home">
  <nav class="sitebar">
    <div class="sbInner">
      <a class="brand on" href="/"><img src="/static/favicon.svg" alt=""><span>Домашний хаб</span></a>
      <div class="sbLinks">
      <a href="/treadmill/"><span class="ni">🏃</span><span class="nl">Дорожка</span></a>
      <a href="/power/"><span class="ni">⚡</span><span class="nl">Станции</span></a>
      <a href="/net/"><span class="ni">🌐</span><span class="nl">Сеть</span></a>
      <a href="/hub/"><span class="ni">🖥️</span><span class="nl">Хаб</span></a>
      </div>
      <span class="sbClock" id="sbClock"></span>
    </div>
  </nav>

  <header class="pagehead"><h1>Главная</h1><span class="muted">дорожка, станции, сеть и хаб — на одной странице</span></header>
  <main class="tiles">
    <a class="tile" id="tTreadmill" href="/treadmill/">
      <div class="tHead"><span class="tIcon">🏃</span><b>Дорожка</b><span class="pill" id="trState">…</span></div>
      <div class="tBody" id="trBody"></div>
    </a>
    <a class="tile" id="tPower" href="/power/">
      <div class="tHead"><span class="tIcon">⚡</span><b>Станции</b><span class="pill" id="pwState">…</span></div>
      <div class="tBody" id="pwBody"></div>
    </a>
    <a class="tile" id="tNet" href="/net/">
      <div class="tHead"><span class="tIcon">🌐</span><b>Сеть</b><span class="pill" id="netState">…</span></div>
      <div class="tBody" id="netBody"></div>
    </a>
    <a class="tile" id="tHub" href="/hub/">
      <div class="tHead"><span class="tIcon">🖥️</span><b>Хаб</b><span class="pill" id="hubState">…</span></div>
      <div class="tBody" id="hubBody"></div>
    </a>
  </main>

  <script src="/static/sitebar.js"></script>
  <script src="/static/home/home.js"></script>
</body>
</html>
