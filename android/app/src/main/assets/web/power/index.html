<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Станции Fossibot F2400: заряд, свет, настройки, статистика и журнал отключений">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <title>Станции · Домашний хаб</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/power/power.css">
</head>
<body class="power">
  <nav class="sitebar">
    <div class="sbInner">
      <a class="brand" href="/"><img src="/static/favicon.svg" alt=""><span>Домашний хаб</span></a>
      <div class="sbLinks">
      <a href="/treadmill/"><span class="ni">🏃</span><span class="nl">Дорожка</span></a>
      <a href="/power/" class="on" aria-current="page"><span class="ni">⚡</span><span class="nl">Станции</span></a>
      <a href="/net/"><span class="ni">🌐</span><span class="nl">Сеть</span></a>
      <a href="/hub/"><span class="ni">🖥️</span><span class="nl">Хаб</span></a>
      </div>
      <span class="sbClock" id="sbClock"></span>
    </div>
  </nav>
  <header class="pagehead"><h1>Станции</h1><span class="muted">Fossibot F2400 · обновление каждые 3 с</span></header>

  <main>
    <div id="stations" class="stationGrid"></div>

    <section class="journal">
      <h3>Журнал отключений света</h3>
      <div id="outages" class="list"></div>
      <button type="button" class="btn wide hidden" id="moreOutages">Показать ещё</button>
    </section>

    <details class="manage">
      <summary>Список станций</summary>
      <p class="muted">Имя и Bluetooth-адрес станции. Станция должна быть в радиусе Bluetooth от хаба (Redmi).</p>
      <div id="stationRows"></div>
      <div class="grid2">
        <button type="button" class="btn" id="addStation">+ Станция</button>
        <button type="button" class="btn go" id="saveStations">Сохранить</button>
      </div>
    </details>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/sitebar.js"></script>
  <script src="/static/power/power.js"></script>
</body>
</html>
